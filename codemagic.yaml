workflows:
  nova-ios-validation:
    name: NOVA iOS Release IPA (iLoader)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 26.2
      cocoapods: default
    scripts:
      - name: Pin NOVA Flutter beta toolchain
        script: |
          set -e
          git clone --filter=blob:none --branch beta https://github.com/flutter/flutter.git "$CM_BUILD_DIR/.codemagic-flutter"
          git -C "$CM_BUILD_DIR/.codemagic-flutter" checkout 38ec981bad973156ad05bdef0aa8e82d1a58905b
          test "$(git -C "$CM_BUILD_DIR/.codemagic-flutter" rev-parse HEAD)" = "38ec981bad973156ad05bdef0aa8e82d1a58905b"
          "$CM_BUILD_DIR/.codemagic-flutter/bin/flutter" --version
      - name: Precache iOS engine artifacts
        script: "$CM_BUILD_DIR/.codemagic-flutter/bin/flutter precache --ios"
      - name: Resolve Flutter dependencies
        script: "$CM_BUILD_DIR/.codemagic-flutter/bin/flutter pub get"
      - name: Analyze Flutter source
        script: "$CM_BUILD_DIR/.codemagic-flutter/bin/flutter analyze --no-pub"
      - name: Run all Flutter unit and widget tests
        script: "$CM_BUILD_DIR/.codemagic-flutter/bin/flutter test --no-pub"
      - name: Verify iOS 15 deployment settings
        script: |
          test "$(grep -c 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' ios/Runner.xcodeproj/project.pbxproj)" -eq 6
          ! grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 13.0;' ios/Runner.xcodeproj/project.pbxproj
      - name: Prepare existing iOS dependencies
        script: |
          if [ -f ios/Podfile ]; then
            (cd ios && pod install)
          else
            echo "No ios/Podfile is checked in; Flutter build will report whether one is required."
          fi
      - name: Compile unsigned iOS app
        script: "$CM_BUILD_DIR/.codemagic-flutter/bin/flutter build ios --release --no-codesign --no-pub"
      - name: Package release IPA for iloader signing
        script: |
          set -e
          app_dir="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          assets_dir="$app_dir/Frameworks/App.framework/flutter_assets"
          output_dir="$CM_BUILD_DIR/build/ios/ipa"
          test -d "$app_dir"
          test -f "$app_dir/Frameworks/App.framework/App"
          test ! -e "$assets_dir/kernel_blob.bin"
          test ! -e "$assets_dir/isolate_snapshot_data"
          test ! -e "$assets_dir/vm_snapshot_data"
          mkdir -p "$output_dir/Payload"
          ditto "$app_dir" "$output_dir/Payload/Runner.app"
          (cd "$output_dir" && ditto -c -k --keepParent Payload Nova-release-unsigned.ipa)
          unzip -tq "$output_dir/Nova-release-unsigned.ipa"
          shasum -a 256 "$output_dir/Nova-release-unsigned.ipa"
    artifacts:
      - build/ios/ipa/Nova-release-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
